<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Controle de Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Painel de Controle - Estoque</h1>
    </header>

    <section id="resumo">
        <div class="card" style="border-bottom-color: var(--primary);">
            <h3>Total em Estoque</h3>
            <p>0 itens</p>
        </div>
        <div class="card" style="border-bottom-color: var(--success);">
            <h3>Entradas de Hoje</h3>
            <p>0 itens</p>
        </div>
        <div class="card" style="border-bottom-color: var(--danger);">
            <h3>Saídas de Hoje</h3>
            <p>0 itens</p>
        </div>
    </section>

    <section id="movimentacao">
        <h2>Registrar Movimentação</h2>
        <form>
            <label for="produto">Nome do Produto:</label>
            <input type="text" id="produto" required>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" required>

            <label for="tipo">Tipo da Movimentação:</label>
            <select id="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>

            <button type="submit">Salvar Registro</button>
        </form>
    </section>

    <section id="inventario">
        <h2>Inventário Atual</h2>
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <input type="text" id="busca" placeholder="Buscar produto ou SKU..." style="flex: 1; margin: 0;">
            <button id="btnExportar" style="margin-top: 0;">📥 Exportar CSV</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Código (SKU)</th>
                    <th>Descrição</th>
                    <th>Saldo Atual</th>
                </tr>
            </thead>
            <tbody>
                <!-- O JavaScript injetará os produtos automaticamente aqui -->
            </tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
